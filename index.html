}
function parseProgress(md){
  var rows={},lines=(logBlock(md)||md).split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var m=LOG_RE.exec(lines[i].trim()); if(!m) continue;
    var date=m[2].trim(), done=(m[6]||'').trim();
    var sd=toDate(date), dd=toDate(done);
    rows[+m[1]]={ day:+m[1], date:date, desk:m[3].toUpperCase(), phone:m[4].toUpperCase(),
      conf:/^[1-5]$/.test(m[5])?+m[5]:null, done:done||null,
      lateBy:(sd&&dd)?Math.max(0,between(sd,dd)):0,
      note:m[7].trim(), raw:lines[i].trim() };
  }
  return rows;
}
function parseParking(md){
  var m=/## Parking lot\s*([\s\S]*?)(?:\n---|\n## |$)/.exec(md); if(!m) return [];
  return m[1].split(/\r?\n/).map(function(l){return l.trim();})
    .filter(function(l){return /^-\s+\S/.test(l);}).map(function(l){return l.replace(/^-\s+/,'');});
}
function parseQueue(md){
  var out=[],lines=md.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var m=/^\[(\d+)\]\s*due:\s*([^|]*)\|([^|]*)\|(.*)$/.exec(lines[i].trim()); if(!m) continue;
    out.push({interval:+m[1],due:m[2].trim(),prompt:m[3].trim()});
  }
  return out;
}
function countApps(md){
  var sec=/## Applications\s*([\s\S]*?)(?:\n---|$)/.exec(md); if(!sec) return 0;
  var n=0,lines=sec[1].split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(l.charAt(0)!=='|') continue;
    var c=l.split('|').slice(1,-1).map(function(x){return x.trim();});
    if(c.length<4) continue;
    if(/^-+$/.test(c[0])||c[0]==='#') continue;
    if(c[2]) n++;
  }
  return n;
}

/* ---------- loading ---------- */
var SRC='live';
function snapshot(){
  var el=document.getElementById('snapshot');
  if(!el) return null;
  try{ return JSON.parse(el.textContent); }catch(e){ return null; }
}
function loadAll(){
  var snap=snapshot();
  return Promise.all(FILES.map(function(p){
    return fetch(p,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(t){
      try{ localStorage.setItem(K.cache+p,t); }catch(e){}
      return [p,t];
    }).catch(function(){
      var cached=null; try{ cached=localStorage.getItem(K.cache+p); }catch(e){}
      if(cached){ SRC='cache'; return [p,cached]; }
      if(snap&&snap.files&&snap.files[p]){ SRC='snapshot'; return [p,snap.files[p]]; }
      SRC='none'; return [p,''];
    });
  })).then(function(pairs){
    var o={}; pairs.forEach(function(p){ o[p[0]]=p[1]; }); return o;
  });
}

/* ---------- model ---------- */
var M = {};
var VIEW = null;   /* which day the card is showing. Defaults to today. */

function todayNum(){ return between(M.start,todayDate())+1; }
/* The furthest day you can open. Never the future: seeing days that have not
   happened is the paralysis this whole layout is built to avoid. */
function maxView(){ return Math.min(28,Math.max(1,todayNum())); }

function localFor(day){
  var all=jget(K.days,{}); return all[day]||{desk:{},phone:{},conf:null};
}
function saveLocal(day,st){
  var all=jget(K.days,{}); all[day]=st; jset(K.days,all);
}
/* Stamp when the work actually happened, once, the first time a past day is
   touched. This is the whole late-work record: ticking Day 02 on Day 05 has to
   say Day 05, or the weekly review cannot tell a backfill from a miss. */
function stampDone(day,st){
  var e=M.schedule[day-1]; if(!e) return st;
  var t=iso(todayDate());
  if(!st.done && t>iso(e.date)) st.done=t;
  return st;
}
function touchedLocal(st){
  return !!(st && (st.conf || st.skipped ||
    Object.keys(st.desk||{}).length || Object.keys(st.phone||{}).length ||
    Object.keys(st.sub||{}).length || Object.keys(st.note||{}).length));
}
/* How many sub-steps of one task are ticked. */
function subDone(st,kind,i,total){
  var n=0,s=st.sub||{};
  for(var j=0;j<total;j++) if(s[kind+':'+i+':'+j]) n++;
  return n;
}
/* Notes typed against sub-steps, as brain dump lines. The dashboard cannot
   write files, so this follows the same copy-and-paste route as the log line. */
function noteLines(day){
  var st=localFor(day), e=M.schedule[day-1], out=[];
  if(!st.note || !e) return out;
  var plan=M.planByBlock[e.block]||{};
  Object.keys(st.note).forEach(function(k){
    var p=k.split(':'), t=((plan[p[0]]||[])[+p[1]]||{subs:[]});
    var step=t.subs[+p[2]]||('step '+(+p[2]+1));
    out.push('- '+step+' — '+st.note[k]);
  });
  return out;
}
function markFor(block,st,kind){
  var tasks=(M.planByBlock[block]||{})[kind]||[];
  if(!tasks.length) return '-';
  if(st.skipped) return 'N';
  var n=0; for(var i=0;i<tasks.length;i++) if(st[kind][i]) n++;
  return n===0?'N':(n===tasks.length?'Y':'P');
}
function fmtLog(o){
  var s='D'+String(o.day).padStart(2,'0')+' | '+o.date+' | desk:'+o.desk+' phone:'+o.phone+
        ' | conf:'+(o.conf||'');
  if(o.done && o.done!==o.date) s+=' | done:'+o.done;
  return s+' | note:'+(o.note?' '+o.note:'');
}
function logLine(entry){
  var st=localFor(entry.day);
  return fmtLog({ day:entry.day, date:iso(entry.date),
    desk:markFor(entry.block,st,'desk'), phone:markFor(entry.block,st,'phone'),
    conf:st.conf||'', done:st.done||'', note:st.skipped?'not done':'' });
}
/* A day is pending when local state produces a line the file does not have. */
function pendingLines(){
  var all=jget(K.days,{}), out=[];
  M.schedule.forEach(function(e){
    if(!touchedLocal(all[e.day])) return;
    var line=logLine(e), row=M.progress[e.day];
    if(!row || row.raw!==line) out.push(line);
  });
  return out;
}

/* ---------- what is finished ---------- */
/* Local ticks win over the file, same as pendingLines: the file is what has
   been synced, localStorage is what has been done. */
function statusFor(day){
  var e=M.schedule[day-1]; if(!e) return {desk:'',phone:''};
  var st=jget(K.days,{})[day];
  if(touchedLocal(st)) return {desk:markFor(e.block,st,'desk'),phone:markFor(e.block,st,'phone')};
  var r=M.progress[day];
  return r ? {desk:r.desk,phone:r.phone} : {desk:'',phone:''};
}
/* "-" means the plan has no block there. Sundays have no desk block, and that
   counts as satisfied rather than missing. */
function isComplete(s){ return /^[Y-]$/.test(s.desk) && /^[Y-]$/.test(s.phone); }
function isWrittenOff(s){
  return /^[N-]$/.test(s.desk) && /^[N-]$/.test(s.phone) && (s.desk==='N'||s.phone==='N');
}
/* Elapsed, not finished, not deliberately written off. The catch-up list. */
function openDays(){
  var t=maxView(), out=[];
  for(var d=1;d<t;d++){
    var s=statusFor(d);
    if(!isComplete(s) && !isWrittenOff(s)) out.push(d);
  }
  return out;
}
function goTo(day){
  VIEW=Math.min(maxView(),Math.max(1,day));
  renderToday(); renderOpen(); renderSync();
  var y=document.getElementById('today').getBoundingClientRect().top+window.pageYOffset-12;
  window.scrollTo(0,Math.max(0,y));
}
function pendingParks(){
  var local=jget(K.park,[]), inFile=M.parking;
  return local.filter(function(t){ return inFile.indexOf(t)<0; });
}

/* ---------- clipboard ---------- */
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.style.display='none'; },1600);
}
function copy(text,label){
  var done=function(){ toast(label||'Copied'); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done,function(){ showOut(text); });
  } else { showOut(text); }
}
function showOut(text){
  var box=document.getElementById('copyout');
  if(!box) return;
  box.style.display='block';
  var ta=box.querySelector('textarea');
  ta.value=text; ta.focus(); ta.select();
  toast('Copy blocked by the browser. Select and copy.');
}

/* ---------- render: today ---------- */
/* Re-render the day card and everything that reads from it. Sub-task ticks
   change counts, notes change the export button, so all four must follow. */
function refreshDay(){ renderToday(); renderSync(); renderOpen(); renderStats(); }
function renderToday(){
  var el=document.getElementById('today');
  var t=todayDate(), n=between(M.start,t)+1;

  if(n<1){
    el.innerHTML='<div class="daynum">Not started</div><h1 class="title">Day 1 is '+
      pretty(M.start)+'</h1><p class="theme-line">'+(1-n===0?'Tomorrow.':(1-n)+' days away.')+
      ' Change START_DATE in <code>tracking/config.md</code> if that is wrong.</p>';
    return;
  }
  var top=maxView();
  if(VIEW===null) VIEW=top;
  var view=Math.min(top,Math.max(1,VIEW)); VIEW=view;

  var entry=M.schedule[view-1], day=M.planByBlock[entry.block]||{desk:[],phone:[],adds:[]};
  var st=localFor(view);
  var behind=between(entry.date,todayDate());
  var status=statusFor(view);
  var h='';

  h+='<div class="daynav">'+
     '<button class="navbtn" id="prevDay" aria-label="Previous day"'+(view<=1?' disabled':'')+'>&#8592;</button>'+
     '<div class="daynum">Day '+String(view).padStart(2,'0')+' of 28 &nbsp;&middot;&nbsp; '+pretty(entry.date)+'</div>'+
     '<button class="navbtn" id="nextDay" aria-label="Next day"'+(view>=top?' disabled':'')+'>&#8594;</button>'+
     (view!==top?'<button class="navbtn jump" id="jumpToday">Today</button>':'')+
     '</div>';
  h+='<h1 class="title">'+md(day.title||'Day '+entry.block)+'</h1>';
  if(day.theme) h+='<p class="theme-line">'+md(day.theme)+'</p>';
  if(day.open) h+='<div class="openfile"><span class="lbl">Open first</span>'+md(day.open)+'</div>';

  if(n>28){
    h+='<div class="shift">Month 1 finished on '+pretty(addDays(M.start,27))+'. Run '+
       '<code>node scripts/weekly-review.js 4</code> then <code>node scripts/new-month.js</code>. '+
       'Anything still unfinished is reachable with the arrows.</div>';
  }
  if(behind>0){
    if(isComplete(status)){
      h+='<div class="shift done">Done.'+(st.done?' Logged as finished on '+st.done+', '+
         behind+' day'+(behind===1?'':'s')+' after it was set for.':'')+'</div>';
    } else if(st.skipped){
      h+='<div class="shift">Written off as a miss. That costs you nothing visible — the streak '+
         'counter does not reset. Tap <b>Undo write-off</b> if you want it back.</div>';
    } else {
      h+='<div class="shift back">Catching up. This day was set for '+pretty(entry.date)+', '+
         behind+' day'+(behind===1?'':'s')+' ago. Do it now and it logs as <b>done late</b>, '+
         'not as a miss. If you are not going to do it, write it off — that is a real answer too.</div>';
    }
  }
  if(entry.block!==view){
    h+='<div class="shift">Using plan block <b>Day '+entry.block+'</b>. '+
       'Your start date is not a Monday, so the consolidation blocks were moved to land on Sundays. '+
       'Log it as <b>D'+String(view).padStart(2,'0')+'</b>.</div>';
  }

  h+=blockHtml('desk','Desk',day.desk,st);
  h+=blockHtml('phone','Phone',day.phone,st);

  if(day.say){
    h+='<div class="say"><div class="lbl">Say it out loud</div><div class="quote">'+md(day.say)+'</div></div>';
  }

  h+='<div class="conf"><div class="lbl">How well did it stick?</div><div class="confrow">';
  for(var c=1;c<=5;c++){
    h+='<button class="confbtn" data-conf="'+c+'" aria-pressed="'+(st.conf===c)+'">'+c+'</button>';
  }
  h+='</div><div class="confhint" id="confHint">'+(st.conf?CONF_HINT[st.conf]:'Be honest. This is what reschedules the queue.')+'</div></div>';

  h+='<div class="actions">'+
     '<button class="btn primary" id="copyDay">Copy '+(view===n?'today\'s':'Day '+String(view).padStart(2,'0'))+' log line</button>'+
     '<button class="btn" id="copyAll">Export all unsaved</button>'+
     (noteLines(view).length ? '<button class="btn" id="copyNotes">Copy brain dump ('+noteLines(view).length+')</button>' : '')+
     (behind>0 && !isComplete(status)
       ? '<button class="btn" id="skipDay">'+(st.skipped?'Undo write-off':'Write it off')+'</button>' : '')+
     '</div><div id="copyout"><textarea readonly></textarea></div>';

  el.innerHTML=h;

  el.querySelectorAll('.task').forEach(function(b){
    b.addEventListener('click',function(ev){
      var kind=b.dataset.kind, i=b.dataset.i, s=localFor(view);
      /* A task with sub-steps opens instead of ticking, unless the tick box
         itself was hit. Ticking the parent is still allowed — some days you
         did the work without walking the list. */
      if(+b.dataset.subs && !ev.target.closest('.box')){
        s.open=s.open||{}; var k=kind+':'+i;
        if(s.open[k]) delete s.open[k]; else s.open[k]=true;
        saveLocal(view,s); refreshDay();
        return;
      }
      if(s[kind][i]) delete s[kind][i]; else s[kind][i]=true;
      delete s.skipped;                       /* doing it un-writes-it-off */
      saveLocal(view,stampDone(view,s));
      b.setAttribute('aria-pressed', s[kind][i]?'true':'false');
      renderSync(); renderOpen(); renderStats();
    });
  });
  el.querySelectorAll('.sub').forEach(function(b){
    b.addEventListener('click',function(ev){
      var kind=b.dataset.kind, i=+b.dataset.i, j=b.dataset.j, key=kind+':'+i+':'+j, s=localFor(view);
      /* The pencil opens this step's note without ticking it off. */
      if(ev.target.closest('[data-note]')){
        s.noteOpen=s.noteOpen||{};
        if(s.noteOpen[key]) delete s.noteOpen[key]; else s.noteOpen[key]=true;
        saveLocal(view,s); refreshDay();
        var ta=document.querySelector('.note[data-key="'+key+'"]'); if(ta) ta.focus();
        return;
      }
      s.sub=s.sub||{};
      if(s.sub[key]) delete s.sub[key]; else s.sub[key]=true;
      delete s.skipped;
      /* The parent follows its children: all of them done means the task is
         done, and un-ticking one takes the parent back off. Nothing else in
         the system reads sub-ticks, so this is what reaches the log line. */
      var total=(((M.planByBlock[M.schedule[view-1].block]||{})[kind]||[])[i]||{subs:[]}).subs.length;
      if(total && subDone(s,kind,i,total)===total) s[kind][i]=true; else delete s[kind][i];
      saveLocal(view,stampDone(view,s));
      refreshDay();
    });
  });
  el.querySelectorAll('.note').forEach(function(ta){
    var key=ta.dataset.key, s0=localFor(view);
    ta.value=(s0.note||{})[key]||'';
    /* Saved on the way out, not per keystroke: re-rendering mid-sentence
       would steal the caret. */
    ta.addEventListener('blur',function(){
      var s=localFor(view); s.note=s.note||{};
      var v=ta.value.trim();
      if(v) s.note[key]=v; else { delete s.note[key]; if(s.noteOpen) delete s.noteOpen[key]; }
      saveLocal(view,stampDone(view,s));
      renderSync(); refreshDay();
    });
  });
  el.querySelectorAll('.confbtn').forEach(function(b){
    b.addEventListener('click',function(){
      var v=+b.dataset.conf, s=localFor(view);
      s.conf = (s.conf===v) ? null : v;
      saveLocal(view,stampDone(view,s));
      el.querySelectorAll('.confbtn').forEach(function(x){
        x.setAttribute('aria-pressed', (+x.dataset.conf===s.conf)?'true':'false');
      });
      document.getElementById('confHint').textContent =
        s.conf?CONF_HINT[s.conf]:'Be honest. This is what reschedules the queue.';
      renderSync(); renderStats();
    });
  });
  if(document.getElementById('prevDay'))
    document.getElementById('prevDay').addEventListener('click',function(){ goTo(view-1); });
  if(document.getElementById('nextDay'))
    document.getElementById('nextDay').addEventListener('click',function(){ goTo(view+1); });
  if(document.getElementById('jumpToday'))
    document.getElementById('jumpToday').addEventListener('click',function(){ goTo(top); });
  if(document.getElementById('skipDay'))
    document.getElementById('skipDay').addEventListener('click',function(){
      var s=localFor(view);
      if(s.skipped) delete s.skipped;
      else { s.skipped=true; s.desk={}; s.phone={}; s.conf=null; delete s.done; }
      saveLocal(view,s);
      renderToday(); renderOpen(); renderSync(); renderStats();
    });
  document.getElementById('copyDay').addEventListener('click',function(){
    copy(logLine(entry),'Log line copied');
  });
  var cn=document.getElementById('copyNotes');
  if(cn) cn.addEventListener('click',function(){
    var lines=noteLines(view);
    copy(lines.join('\n'),lines.length+' note(s) copied — paste into tracking/braindump.md');
  });
  document.getElementById('copyAll').addEventListener('click',function(){
    var lines=pendingLines().concat(pendingParks().map(function(t){return '- '+t;}));
    if(!lines.length){ toast('Nothing unsaved'); return; }
    copy(lines.join('\n'),lines.length+' line(s) copied');
  });
}

function blockHtml(kind,label,tasks,st){
  if(!tasks || !tasks.length){
    if(kind!=='desk') return '';
    return '<div class="block desk"><div class="blockhead">Desk <span class="mins">no desk block today, deliberately</span></div></div>';
  }
  var mins=0;
  var rows=tasks.map(function(t,i){
    var m=/^(\d+)\s*min/.exec(t.text); if(m) mins+=+m[1];
    var open=st.open&&st.open[kind+':'+i];
    var head='<button class="task" data-kind="'+kind+'" data-i="'+i+'" data-subs="'+t.subs.length+
      '" data-open="'+(open?1:0)+'" aria-pressed="'+(st[kind][i]?'true':'false')+'">'+
      '<span class="box">&#10003;</span><span class="txt">'+md(t.text)+'</span>'+
      (t.subs.length ? '<span class="count">'+subDone(st,kind,i,t.subs.length)+'/'+t.subs.length+
                       '</span><span class="chev">&#9654;</span>' : '')+
      '</button>';
    if(!t.subs.length) return head;

    var subs=t.subs.map(function(s,j){
      var key=kind+':'+i+':'+j, note=(st.note||{})[key]||'';
      return '<button class="sub" data-kind="'+kind+'" data-i="'+i+'" data-j="'+j+
        '" aria-pressed="'+((st.sub||{})[key]?'true':'false')+'">'+
        '<span class="box">&#10003;</span><span class="txt">'+md(s)+'</span>'+
        '<span class="n'+(note?' has':'')+'" data-note="'+key+'">&#9998;</span></button>'+
        (note||(st.noteOpen||{})[key]
          ? '<textarea class="note" data-key="'+key+'" placeholder="What happened on this one? Wrong turns count."></textarea>'
          : '');
    }).join('');
    return head+'<div class="subs"'+(open?'':' hidden')+'>'+subs+'</div>';
  }).join('');
  return '<div class="block '+kind+'"><div class="blockhead">'+label+
    (mins?' <span class="mins">'+mins+' min</span>':'')+'</div>'+rows+'</div>';
}

/* ---------- render: days not finished ----------
   Only elapsed days, never the future, and only the recent end of the list.
   A visible backlog you cannot see the end of is what gets systems abandoned,
   so this stays short and disappears entirely when there is nothing in it. */
function renderOpen(){
  var card=document.getElementById('openCard');
  var open=openDays();
  if(!open.length){ card.hidden=true; return; }
  card.hidden=false;

  var SHOW=6, shown=open.slice(-SHOW), hidden=open.length-shown.length;
  var h='';
  shown.forEach(function(d){
    var e=M.schedule[d-1], s=statusFor(d);
    var part=/^P$/.test(s.desk)||/^P$/.test(s.phone)||/^Y$/.test(s.desk)||/^Y$/.test(s.phone);
    h+='<button data-day="'+d+'"'+(part?' class="on"':'')+'>Day '+String(d).padStart(2,'0')+
       '<span class="d">'+pretty(e.date)+(part?' · part done':'')+'</span></button>';
  });
  document.getElementById('openDays').innerHTML=h;
  document.getElementById('openDays').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ goTo(+b.dataset.day); });
  });

  document.getElementById('openHint').textContent =
    (hidden>0 ? hidden+' older day'+(hidden===1?'':'s')+' also unfinished and held back. ' : '')+
    (open.length>=3
      ? 'Do not try to clear all of these. Pick the most recent one or two, and write the rest off.'
      : 'Tap one to open it. Finishing it late still counts, and it logs as done late.');
}

/* ---------- render: due today ---------- */
function renderDue(){
  var box=document.getElementById('due'), t=iso(todayDate());
  var dated=M.queue.filter(function(q){ return /^\d{4}-\d{2}-\d{2}$/.test(q.due); });

  if(!dated.length){
    box.innerHTML='<p class="tiny" style="margin:0">No due dates set yet. Run '+
      '<code>node scripts/seed-queue.js</code> once and this fills itself.</p>';
    return;
  }
  var due=dated.filter(function(q){ return q.due<=t; })
               .sort(function(a,b){ return a.due<b.due?-1:1; });
  var shown=due.slice(0,8), hidden=due.length-shown.length;

  if(!due.length){
    var next=dated.map(function(q){return q.due;}).sort()[0];
    box.innerHTML='<p class="tiny" style="margin:0">Nothing due today. Next batch '+pretty(toDate(next))+'.</p>';
    return;
  }
  var h='<ul class="due">';
  shown.forEach(function(q){
    var late=q.due<t;
    h+='<li><span class="pill'+(late?' late':'')+'">'+q.interval+'d</span><span>'+md(q.prompt)+'</span></li>';
  });
  h+='</ul>';
  var held=M.queue.length-dated.length;
  h+='<p class="tiny" style="margin:12px 0 0">Read the prompt, say the answer out loud, then check. '+
     (hidden>0?'<b>'+hidden+' more held back to keep this block short.</b> ':'')+
     (held>0?held+' item(s) are waiting on a day you have not done yet, so they are not being asked.':'')+'</p>';
  box.innerHTML=h;
}

/* ---------- render: rings and streak ---------- */
function ring(pct,val,cap,color){
  var r=32, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<div class="ring"><svg width="86" height="86" viewBox="0 0 86 86">'+
    '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="var(--bg3)" stroke-width="8"/>'+
    '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 43 43)"/>'+
    '<text x="43" y="48" text-anchor="middle" fill="var(--fg)" font-size="17" font-weight="700" '+
    'font-family="inherit">'+val+'</text></svg><div class="cap">'+cap+'</div></div>';
}
function activity(){
  var all=jget(K.days,{}), active=[], t=todayDate();
  M.schedule.forEach(function(e){
    var row=M.progress[e.day], on=false;
    if(row && (/^[YP]$/.test(row.desk)||/^[YP]$/.test(row.phone))) on=true;
    var st=all[e.day];
    if(st && (st.conf || Object.keys(st.desk||{}).length || Object.keys(st.phone||{}).length)) on=true;
    if(on) active.push(e.day);
  });
  var n=Math.min(28,Math.max(1,between(M.start,t)+1));
  var week=Math.min(4,Math.ceil(n/7));
  var thisWeek=active.filter(function(d){ return Math.ceil(d/7)===week; }).length;
  return {total:active.length,week:week,thisWeek:thisWeek};
}
function renderStats(){
  var a=activity();
  var t=iso(todayDate());
  var dated=M.queue.filter(function(q){ return /^\d{4}-\d{2}-\d{2}$/.test(q.due); });
  var overdue=dated.filter(function(q){ return q.due<t; }).length;
  var health=dated.length?(1-overdue/dated.length):0;

  document.getElementById('rings').innerHTML =
    ring(a.total/28, a.total+'/28', 'days active<br>this month', 'var(--accent)') +
    ring(health, dated.length?Math.round(health*100)+'%':'--', dated.length?(overdue?overdue+' overdue':'queue clear'):'queue not seeded', 'var(--phone)') +
    ring(M.apps/APP_TARGET, M.apps+'/'+APP_TARGET, 'applications<br>submitted', 'var(--desk)');

  document.getElementById('streak').innerHTML =
    '<div><b>'+a.total+'</b><span>days active, all time</span></div>'+
    '<div><b>'+a.thisWeek+'</b><span>days active, week '+a.week+'</span></div>';
}

/* ---------- render: sync ---------- */
function renderSync(){
  var n=pendingLines().length+pendingParks().length;
  var dot=document.getElementById('syncDot'), txt=document.getElementById('syncTxt');
  if(n){ dot.classList.add('pending'); txt.innerHTML='<b>'+n+' unsynced</b>'; }
  else { dot.classList.remove('pending'); txt.textContent='synced'; }
}
function renderPark(){
  var pend=pendingParks().length;
  document.getElementById('parkCount').textContent =
    M.parking.length+' in progress.md'+(pend?', '+pend+' waiting to sync':'')+'.';
}

/* ---------- render: full plan ---------- */
function renderPlan(){
  var h='';
  M.schedule.forEach(function(e){
    var d=M.planByBlock[e.block]; if(!d) return;
    var lists='';
    if(d.open) lists+='<div class="openfile" style="margin-top:8px">'+
                     '<span class="lbl">Open first</span>'+md(d.open)+'</div>';
    if(d.desk.length) lists+='<h4 class="d">Desk</h4><ul>'+d.desk.map(li).join('')+'</ul>';
    if(d.phone.length) lists+='<h4 class="p">Phone</h4><ul>'+d.phone.map(li).join('')+'</ul>';
    if(d.say) lists+='<div class="sayline">Say it out loud: '+md(d.say)+'</div>';
    h+='<details><summary>Day '+String(e.day).padStart(2,'0')+' '+esc(shortTitle(d.title))+
       '<span class="sumday">'+pretty(e.date)+'</span></summary><div class="plan-inner">'+lists+'</div></details>';
  });
  document.getElementById('plan').innerHTML=h;
}
/* Tasks are {text, subs}, not strings — passing the object straight to md()
   rendered "[object Object]" for every line in the full-plan list. Sub-steps
   nest underneath so the collapsed view shows the whole day, not just headings. */
function li(t){
  var txt = (t && typeof t==='object') ? t.text : t;
  var subs = (t && t.subs && t.subs.length)
    ? '<ul>'+t.subs.map(function(s){ return '<li>'+md(s)+'</li>'; }).join('')+'</ul>'
    : '';
  return '<li>'+md(txt)+subs+'</li>';
}
function shortTitle(t){ return t.length>34 ? t.slice(0,33)+'…' : t; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* Escape first, then the two bits of inline markdown the plan actually uses.
   Anything else stays literal, which is the safe direction to fail in. */
function md(s){
  /* Bold before italic, or the ** of a bold run gets eaten as two italics.
     Italics carry the asides in the plan's sub-steps, so they have to render
     rather than showing their own asterisks. */
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*]+)\*/g,'<i>$1</i>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

/* ---------- theme ---------- */
function applyTheme(v){
  document.documentElement.setAttribute('data-theme',v);
  /* Keep the status bar tint following the in-app toggle, not the phone's
     system setting, or the two disagree when they are set differently. */
  var metas=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<metas.length;i++) metas[i].setAttribute('media', i===0?'all':'not all');
  if(metas[0]) metas[0].setAttribute('content', v==='dark' ? '#0d1117' : '#f7f8fa');
  document.getElementById('themeBtn').innerHTML = v==='dark' ? '&#9681;' : '&#9680;';
  document.getElementById('themeBtn').setAttribute('aria-label',
    v==='dark'?'Switch to light mode':'Switch to dark mode');
}

/* ---------- boot ---------- */
applyTheme(jget(K.theme,'dark'));
document.getElementById('themeBtn').addEventListener('click',function(){
  var v = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  jset(K.theme,v); applyTheme(v); renderStats();
});

document.getElementById('parkBtn').addEventListener('click',park);
document.getElementById('parkIn').addEventListener('keydown',function(e){ if(e.key==='Enter') park(); });
function park(){
  var i=document.getElementById('parkIn'), v=i.value.trim();
  if(!v) return;
  var list=jget(K.park,[]); list.push(v); jset(K.park,list);
  i.value='';
  copy('- '+v,'Parked and copied');
  renderPark(); renderSync();
}

loadAll().then(function(f){
  var startM=/^START_DATE:\s*(\S+)/m.exec(f['tracking/config.md']||'');
  M.start = (startM && toDate(startM[1])) || todayDate();
  M.schedule = buildSchedule(M.start);
  M.plan = parsePlan(f['plan/month-01.md']||'');
  M.planByBlock = {}; M.plan.forEach(function(d){ M.planByBlock[d.block]=d; });
  M.progress = parseProgress(f['tracking/progress.md']||'');
  M.parking = parseParking(f['tracking/progress.md']||'');
  M.queue = parseQueue(f['tracking/review-queue.md']||'');
  M.apps = countApps(f['tracking/applications.md']||'');

  renderToday(); renderOpen(); renderDue(); renderStats(); renderSync(); renderPark(); renderPlan();

  var snap=snapshot();
  var msg={
    live:'Reading the markdown files live.',
    cache:'Offline. Showing the last version this device loaded.',
    snapshot:'Offline. Showing the snapshot baked in'+(snap&&snap.generatedAt?' on '+snap.generatedAt:'')+
             '. Open over http, or via GitHub Pages, to read the files live.',
    none:'Could not read the markdown files and there is no snapshot. Run node scripts/build-snapshot.js.'
  }[SRC];
  document.getElementById('src').textContent=msg;
}).catch(function(e){
  document.getElementById('today').innerHTML='<p class="mute">Failed to load: '+esc(e.message)+'</p>';
});
</script>
