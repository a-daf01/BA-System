}
/* Mirrors scripts/lib.js. The `done:` field is optional and holds the date the
   work actually happened, written only when that is not the day's own date. */
var LOG_RE=/^D(\d{2})\s*\|\s*([^|]*)\|\s*desk:(\S*)\s+phone:(\S*)\s*\|\s*conf:(\S*)\s*\|(?:\s*done:([^|]*)\|)?\s*note:(.*)$/;
/* Scoped to the fenced block under "## Log". The Format section above it holds
   a worked D01 example that is documentation, not data. */
function logBlock(md){
  var i=md.indexOf('## Log'); if(i<0) return null;
  var m=/```[^\n]*\n([\s\S]*?)```/.exec(md.slice(i));
  return m? m[1] : null;
}
function parseProgress(md){
  var rows={},lines=(logBlock(md)||md).split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var m=LOG_RE.exec(lines[i].trim()); if(!m) continue;
    var date=m[2].trim(), done=(m[6]||'').trim();
    var sd=toDate(date), dd=toDate(done);
    rows[+m[1]]={ day:+m[1], date:date, desk:m[3].toUpperCase(), phone:m[4].toUpperCase(),
      conf:/^[1-5]$/.test(m[5])?+m[5]:null, done:done||null,
      lateBy:(sd&&dd)?Math.max(0,between(sd,dd)):0,
      note:m[7].trim(), raw:lines[i].trim() };
  }
  return rows;
}
function parseParking(md){
  var m=/## Parking lot\s*([\s\S]*?)(?:\n---|\n## |$)/.exec(md); if(!m) return [];
  return m[1].split(/\r?\n/).map(function(l){return l.trim();})
    .filter(function(l){return /^-\s+\S/.test(l);}).map(function(l){return l.replace(/^-\s+/,'');});
}
function parseQueue(md){
  var out=[],lines=md.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var m=/^\[(\d+)\]\s*due:\s*([^|]*)\|([^|]*)\|(.*)$/.exec(lines[i].trim()); if(!m) continue;
    out.push({interval:+m[1],due:m[2].trim(),prompt:m[3].trim()});
  }
  return out;
}
/* The back of each flash card, from tracking/review-cards.md. Mirrors
   parseCards in scripts/lib.js — keyed on the normalised prompt, so editing a
   prompt's punctuation does not silently orphan its answer. An item with no
   card still reviews, it just has nothing behind it. */
function normKey(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function parseCards(md){
  var out={}, parts=String(md||'').split(/^###\s+/m).slice(1);
  parts.forEach(function(part){
    var nl=part.indexOf('\n');
    var prompt=(nl===-1?part:part.slice(0,nl)).trim();
    var body=nl===-1?'':part.slice(nl+1);
    /* A "## " section heading ends the card, or the title below it gets
       swallowed into the answer above it. */
    var cut=body.search(/^##\s/m); if(cut!==-1) body=body.slice(0,cut);
    if(!prompt) return;
    var from=/^\*\*From:\*\*\s*(.*)$/m.exec(body);
    var hint=/^\*\*Hint:\*\*\s*(.*)$/m.exec(body);
    var ai=body.search(/^\*\*Answer:\*\*\s*$/m), answer='';
    if(ai!==-1) answer=body.slice(ai).replace(/^\*\*Answer:\*\*\s*\n?/,'').replace(/\s+$/,'');
    out[normKey(prompt)]={from:from?from[1].trim():'',hint:hint?hint[1].trim():'',answer:answer};
  });
  return out;
}
function cardFor(prompt){ return (M.cards||{})[normKey(prompt)]||null; }
var normalise = normKey;

/* tracking/time-log.md, as a lookup of "date normalised-context" -> seconds.
   What has already been filed, so a reading that has not moved stops showing as
   unsynced. */
function parseTimeFile(md){
  var out={}, i=String(md).indexOf('## Log');
  if(i<0) return out;
  var m=/```[^\n]*\n([\s\S]*?)```/.exec(md.slice(i));
  if(!m) return out;
  m[1].split(/\r?\n/).forEach(function(raw){
    var r=/^(\d{4}-\d{2}-\d{2})\s*\|\s*([^|]+?)\s*\|\s*(\d+)\s*\|\s*([^|]*?)\s*\|\s*budget:(\d*)\s*$/.exec(raw.trim());
    if(r) out[r[1]+' '+normKey(r[2])]={seconds:+r[3],span:r[4].trim()};
  });
  return out;
}

/* tracking/notes.md, as a lookup of "date normalised-context" -> text. This is
   what has already been filed, and it is the only thing that takes a note out of
   the unsynced count. Same contract as the review log. */
function parseNotesFile(md){
  var out={}, date=null, ctx=null, entries=null, cur=null;
  function closeEntry(){
    if(cur){ cur.text=cur.text.join('\n').replace(/^\s+|\s+$/g,''); entries.push(cur); }
    cur=null;
  }
  function flush(){
    closeEntry();
    if(date&&ctx) out[date+' '+normKey(ctx)]=entries;
    ctx=null; entries=null;
  }
  String(md).split(/\r?\n/).forEach(function(line){
    var d=/^##\s+(\d{4}-\d{2}-\d{2})\s*$/.exec(line);
    if(d){ flush(); date=d[1]; return; }
    var c=/^####\s+(.+?)\s*$/.exec(line);
    if(c){ flush(); ctx=c[1]; entries=[]; return; }
    if(!ctx) return;
    var e=/^\*\*(\d{2}:\d{2})\*\*\s+—\s+([\s\S]*)$/.exec(line);
    if(e){ closeEntry(); cur={time:e[1],text:[e[2]]}; return; }
    if(cur) cur.text.push(line);
    else if(line.trim()) cur={time:'',text:[line]};
  });
  flush();
  return out;
}
/* Has this exact entry already been filed? Keyed on context + the minute it was
   logged, which is what makes an edit an edit rather than a second note. */
function noteFiled(date,ctx,time,text){
  var list=M.notes[date+' '+normKey(ctx)];
  if(!list) return false;
  for(var i=0;i<list.length;i++) if(list[i].time===time) return list[i].text===text;
  return false;
}

/* tracking/review-log.md, as a lookup of "date normalised-prompt" -> score.
   This is the record of what has already been synced, and it is the only thing
   that takes a grade out of the unsynced count. */
function parseReviewLog(md){
  var out={}, i=String(md).indexOf('## Log');
  if(i<0) return out;
  var m=/```[^\n]*\n([\s\S]*?)```/.exec(md.slice(i));
  if(!m) return out;
  m[1].split(/\r?\n/).forEach(function(raw){
    var r=/^(\d{4}-\d{2}-\d{2})\s*\|\s*([1-5])\s*\|\s*(.+)$/.exec(raw.trim());
    if(r) out[r[1]+' '+normKey(r[3])]=+r[2];
  });
  return out;
}

function countApps(md){
  var sec=/## Applications\s*([\s\S]*?)(?:\n---|$)/.exec(md); if(!sec) return 0;
  var n=0,lines=sec[1].split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(l.charAt(0)!=='|') continue;
    var c=l.split('|').slice(1,-1).map(function(x){return x.trim();});
    if(c.length<4) continue;
    if(/^-+$/.test(c[0])||c[0]==='#') continue;
    if(c[2]) n++;
  }
  return n;
}

/* ---------- loading ---------- */
var SRC='live';
function snapshot(){
  var el=document.getElementById('snapshot');
  if(!el) return null;
  try{ return JSON.parse(el.textContent); }catch(e){ return null; }
}
function loadAll(){
  var snap=snapshot();
  return Promise.all(FILES.map(function(p){
    return fetch(p,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(t){
      try{ localStorage.setItem(K.cache+p,t); }catch(e){}
      return [p,t];
    }).catch(function(){
      var cached=null; try{ cached=localStorage.getItem(K.cache+p); }catch(e){}
      if(cached){ SRC='cache'; return [p,cached]; }
      if(snap&&snap.files&&snap.files[p]){ SRC='snapshot'; return [p,snap.files[p]]; }
      SRC='none'; return [p,''];
    });
  })).then(function(pairs){
    var o={}; pairs.forEach(function(p){ o[p[0]]=p[1]; }); return o;
  });
}

/* ---------- model ---------- */
var M = {};
var VIEW = null;   /* which day the card is showing. Defaults to today. */

function todayNum(){ return between(M.start,todayDate())+1; }
/* The furthest day you can open. Never the future: seeing days that have not
   happened is the paralysis this whole layout is built to avoid. */
function maxView(){ return Math.min(28,Math.max(1,todayNum())); }

function localFor(day){
  var all=jget(K.days,{}); return all[day]||{desk:{},phone:{},conf:null};
}
function saveLocal(day,st){
  var all=jget(K.days,{}); all[day]=st; jset(K.days,all);
}
/* Stamp when the work actually happened, once, the first time a past day is
   touched. This is the whole late-work record: ticking Day 02 on Day 05 has to
   say Day 05, or the weekly review cannot tell a backfill from a miss. */
function stampDone(day,st){
  var e=M.schedule[day-1]; if(!e) return st;
  var t=iso(todayDate());
  if(!st.done && t>iso(e.date)) st.done=t;
  return st;
}
function touchedLocal(st){
  return !!(st && (st.conf || st.skipped ||
    Object.keys(st.desk||{}).length || Object.keys(st.phone||{}).length ||
    Object.keys(st.sub||{}).length || Object.keys(st.note||{}).length));
}
/* How many sub-steps of one task are ticked. */
function subDone(st,kind,i,total){
  var n=0,s=st.sub||{};
  for(var j=0;j<total;j++) if(s[kind+':'+i+':'+j]) n++;
  return n;
}
/* Notes typed against this day, as sync lines. The dashboard cannot write
   files, so they take the same copy-and-paste route as the log line. */
function noteCount(day){
  var st=localFor(day), n=0;
  if(st.note) Object.keys(st.note).forEach(function(k){ n+=entriesFor(st,k).length; });
  return n;
}
function dayNoteLines(day){
  var st=localFor(day), e=M.schedule[day-1], out=[];
  if(!st.note || !e) return out;
  var when=st.done||iso(e.date);
  Object.keys(st.note).sort().forEach(function(k){
    entriesFor(st,k).forEach(function(en){
      out.push(noteLine(when,en.time,noteContext(day,k),en.text));
    });
  });
  return out;
}
function markFor(block,st,kind){
  var tasks=(M.planByBlock[block]||{})[kind]||[];
  if(!tasks.length) return '-';
  if(st.skipped) return 'N';
  var n=0; for(var i=0;i<tasks.length;i++) if(st[kind][i]) n++;
  return n===0?'N':(n===tasks.length?'Y':'P');
}
function fmtLog(o){
  var s='D'+String(o.day).padStart(2,'0')+' | '+o.date+' | desk:'+o.desk+' phone:'+o.phone+
        ' | conf:'+(o.conf||'');
  if(o.done && o.done!==o.date) s+=' | done:'+o.done;
  return s+' | note:'+(o.note?' '+o.note:'');
}
function logLine(entry){
  var st=localFor(entry.day);
  return fmtLog({ day:entry.day, date:iso(entry.date),
    desk:markFor(entry.block,st,'desk'), phone:markFor(entry.block,st,'phone'),
    conf:st.conf||'', done:st.done||'', note:st.skipped?'not done':'' });
}
/* A day is pending when local state produces a line the file does not have. */
function pendingLines(){
  var all=jget(K.days,{}), out=[];
  M.schedule.forEach(function(e){
    if(!touchedLocal(all[e.day])) return;
    var line=logLine(e), row=M.progress[e.day];
    if(!row || row.raw!==line) out.push(line);
  });
  return out;
}

/* ---------- what is finished ---------- */
/* Local ticks win over the file, same as pendingLines: the file is what has
   been synced, localStorage is what has been done. */
function statusFor(day){
  var e=M.schedule[day-1]; if(!e) return {desk:'',phone:''};
  var st=jget(K.days,{})[day];
  if(touchedLocal(st)) return {desk:markFor(e.block,st,'desk'),phone:markFor(e.block,st,'phone')};
  var r=M.progress[day];
  return r ? {desk:r.desk,phone:r.phone} : {desk:'',phone:''};
}
/* "-" means the plan has no block there. Sundays have no desk block, and that
   counts as satisfied rather than missing. */
function isComplete(s){ return /^[Y-]$/.test(s.desk) && /^[Y-]$/.test(s.phone); }
function isWrittenOff(s){
  return /^[N-]$/.test(s.desk) && /^[N-]$/.test(s.phone) && (s.desk==='N'||s.phone==='N');
}
/* Elapsed, not finished, not deliberately written off. The catch-up list. */
function openDays(){
  var t=maxView(), out=[];
  for(var d=1;d<t;d++){
    var s=statusFor(d);
    if(!isComplete(s) && !isWrittenOff(s)) out.push(d);
  }
  return out;
}
function goTo(day){
  VIEW=Math.min(maxView(),Math.max(1,day));
  renderToday(); renderOpen(); renderSync();
  var y=document.getElementById('today').getBoundingClientRect().top+window.pageYOffset-12;
  window.scrollTo(0,Math.max(0,y));
}
function pendingParks(){
  var local=jget(K.park,[]), inFile=M.parking;
  return local.filter(function(t){ return inFile.indexOf(t)<0; });
}

/* ---------- clipboard ---------- */
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.style.display='none'; },1600);
}
function copy(text,label){
  var done=function(){ toast(label||'Copied'); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done,function(){ showOut(text); });
  } else { showOut(text); }
}
function showOut(text){
  var box=document.getElementById('copyout');
  if(!box) return;
  box.style.display='block';
  var ta=box.querySelector('textarea');
  ta.value=text; ta.focus(); ta.select();
  toast('Copy blocked by the browser. Select and copy.');

/* ---------- render: today ---------- */
/* Re-render the day card and everything that reads from it. Sub-task ticks
   change counts, notes change the export button, so all four must follow. */
function refreshDay(){ renderToday(); renderSync(); renderOpen(); renderStats(); }
function renderToday(){

  }

  h+='<div class="actions">'+
     '<button class="btn primary" id="copyDay">Copy '+(view===n?'today\'s':'Day '+String(view).padStart(2,'0'))+' log line</button>'+
     '<button class="btn" id="copyAll">Export all unsaved</button>'+
     (noteCount(view) ? '<button class="btn" id="copyNotes">Copy '+noteCount(view)+' note'+(noteCount(view)===1?'':'s')+'</button>' : '')+
     (behind>0 && !isComplete(status)
       ? '<button class="btn" id="skipDay">'+(st.skipped?'Undo write-off':'Write it off')+'</button>' : '')+

  el.querySelectorAll('.task').forEach(function(b){

      var total=(((M.planByBlock[M.schedule[view-1].block]||{})[kind]||[])[i]||{subs:[]}).subs.length;

    refreshDay();
    var next=document.querySelector('.note[data-key="'+key+'"]');
    if(next) next.focus();
  }
  el.querySelectorAll('.note').forEach(function(ta){
    ta.addEventListener('keydown',function(ev){
      if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); logEntry(ta.dataset.key,ta); }
    });
  });
  el.querySelectorAll('[data-log]').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.dataset.log;
      logEntry(key,document.querySelector('.note[data-key="'+key+'"]'));
    });
  });
  el.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      delEntry(view,b.dataset.del,+b.dataset.idx);
      refreshDay();
    });
  });
  el.querySelectorAll('[data-timer]').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.dataset.timer;
      if(isRunning(view,key)) stopTimer(); else startTimer(view,key);
      refreshDay();
    });
  });
  el.querySelectorAll('.confbtn').forEach(function(b){
    b.addEventListener('click',function(){
      var v=+b.dataset.conf, s=localFor(view);
      s.conf = (s.conf===v) ? null : v;
      saveLocal(view,stampDone(view,s));
      el.querySelectorAll('.confbtn').forEach(function(x){
        x.setAttribute('aria-pressed', (+x.dataset.conf===s.conf)?'true':'false');
      });
      document.getElementById('confHint').textContent =
        s.conf?CONF_HINT[s.conf]:'Be honest. This is what reschedules the queue.';
      renderSync(); renderStats();
    });
  });
  if(document.getElementById('prevDay'))
    document.getElementById('prevDay').addEventListener('click',function(){ goTo(view-1); });
  if(document.getElementById('nextDay'))
    document.getElementById('nextDay').addEventListener('click',function(){ goTo(view+1); });
  if(document.getElementById('jumpToday'))
    document.getElementById('jumpToday').addEventListener('click',function(){ goTo(top); });
  if(document.getElementById('skipDay'))
    document.getElementById('skipDay').addEventListener('click',function(){
      var s=localFor(view);
      if(s.skipped) delete s.skipped;
      else { s.skipped=true; s.desk={}; s.phone={}; s.conf=null; delete s.done; }
      saveLocal(view,s);
      renderToday(); renderOpen(); renderSync(); renderStats();
    });
  document.getElementById('copyDay').addEventListener('click',function(){
    copy(logLine(entry),'Log line copied');
  });
  var cn=document.getElementById('copyNotes');
  if(cn) cn.addEventListener('click',function(){
    var lines=dayNoteLines(view);
    copy(lines.join('\n'),lines.length+' note(s) copied');
  });
  document.getElementById('copyAll').addEventListener('click',function(){
    var lines=pendingLines().concat(pendingReviews(), pendingNotes(), pendingTimes(),
                                    pendingParks().map(function(t){return '- '+t;}));
    if(!lines.length){ toast('Nothing unsaved'); return; }
    copy(lines.join('\n'),lines.length+' line(s) copied');
  });
}

function blockHtml(kind,label,tasks,st){
  if(!tasks || !tasks.length){
    if(kind!=='desk') return '';
    return '<div class="block desk"><div class="blockhead">Desk <span class="mins">no desk block today, deliberately</span></div></div>';
  }
  var mins=0;
  var rows=tasks.map(function(t,i){
    var m=/^(\d+)\s*min/.exec(t.text); if(m) mins+=+m[1];
    var open=st.open&&st.open[kind+':'+i];
    var tkey=kind+':'+i, tents=entriesFor(st,tkey);
    var tnote=tents.length?'1':'';
    var head='<button class="task" data-kind="'+kind+'" data-i="'+i+'" data-subs="'+t.subs.length+
      '" data-open="'+(open?1:0)+'" aria-pressed="'+(st[kind][i]?'true':'false')+'">'+
      '<span class="box">&#10003;</span><span class="txt">'+md(t.text)+'</span>'+
      '<span class="n'+(tnote?' has':'')+'" data-note="'+tkey+'">&#9998;</span>'+
      (t.subs.length ? '<span class="count">'+subDone(st,kind,i,t.subs.length)+'/'+t.subs.length+
                       '</span><span class="chev">&#9654;</span>' : '')+
      '</button>';
    /* The timer sits under the task it is timing. It shows whenever the task is
       open or has already been worked on, never on a row you have not touched —
       twelve idle stopwatches on screen is noise, not urgency. */
    var trec=timeFor(view,tkey);
    var tclock=(open||trec.sec||isRunning(view,tkey)) ? timerHtml(view,tkey) : '';
    /* The entry list hangs off the task itself, above its sub-steps, so working
       on the whole task has somewhere to go that is not one of its steps. */
    var tbox=(tents.length||(st.noteOpen||{})[tkey])
      ? entriesHtml(tents,tkey,'What you tried, what broke, what worked. Tap Log and it is stamped with the time.')
      : '';
    if(!t.subs.length) return head+tclock+tbox;

    var subs=t.subs.map(function(s,j){
      var key=kind+':'+i+':'+j, ents=entriesFor(st,key);
      return '<button class="sub" data-kind="'+kind+'" data-i="'+i+'" data-j="'+j+
        '" aria-pressed="'+((st.sub||{})[key]?'true':'false')+'">'+
        '<span class="box">&#10003;</span><span class="txt">'+md(s)+'</span>'+
        '<span class="n'+(ents.length?' has':'')+'" data-note="'+key+'">&#9998;</span></button>'+
        (ents.length||(st.noteOpen||{})[key]
          ? entriesHtml(ents,key,'What happened on this one? Wrong turns count.')
          : '');
    }).join('');
    return head+tclock+tbox+'<div class="subs"'+(open?'':' hidden')+'>'+subs+'</div>';
  }).join('');
  return '<div class="block '+kind+'"><div class="blockhead">'+label+
    (mins?' <span class="mins">'+mins+' min</span>':'')+'</div>'+rows+'</div>';
}

/* ---------- render: days not finished ----------
   Only elapsed days, never the future, and only the recent end of the list.
   A visible backlog you cannot see the end of is what gets systems abandoned,
   so this stays short and disappears entirely when there is nothing in it. */
function renderOpen(){
  var card=document.getElementById('openCard');
  var open=openDays();
  if(!open.length){ card.hidden=true; return; }
  card.hidden=false;

  var SHOW=6, shown=open.slice(-SHOW), hidden=open.length-shown.length;
  var h='';
  shown.forEach(function(d){
    var e=M.schedule[d-1], s=statusFor(d);
    var part=/^P$/.test(s.desk)||/^P$/.test(s.phone)||/^Y$/.test(s.desk)||/^Y$/.test(s.phone);
    h+='<button data-day="'+d+'"'+(part?' class="on"':'')+'>Day '+String(d).padStart(2,'0')+
       '<span class="d">'+pretty(e.date)+(part?' · part done':'')+'</span></button>';
  });
  document.getElementById('openDays').innerHTML=h;
  document.getElementById('openDays').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ goTo(+b.dataset.day); });
  });

  document.getElementById('openHint').textContent =
    (hidden>0 ? hidden+' older day'+(hidden===1?'':'s')+' also unfinished and held back. ' : '')+
    (open.length>=3
      ? 'Do not try to clear all of these. Pick the most recent one or two, and write the rest off.'
      : 'Tap one to open it. Finishing it late still counts, and it logs as done late.');
}

/* ---------- render: due today ---------- */
/* The batch is frozen for the day so nothing moves under your thumb: you grade
   the eight in front of you, then tap Next 8 to pull the next eight overdue.
   Grading is the only thing that reschedules an item, and it is a real record
   the moment you tap it. */
function renderDue(){
  var box=document.getElementById('due'), t=iso(todayDate());
  var dated=M.queue.filter(function(q){ return /^\d{4}-\d{2}-\d{2}$/.test(q.due); });

  if(!dated.length){
    box.innerHTML='<p class="tiny" style="margin:0">No due dates set yet. Run '+
      '<code>node scripts/seed-queue.js</code> once and this fills itself.</p>';
    return;
  }
  var pool=dated.filter(function(q){ return q.due<=t; })
                .sort(function(a,b){ return a.due<b.due?-1:1; });
  var grades=reviewGrades();
  var gradedToday=pool.filter(function(q){ return grades[q.prompt]!=null; }).length;

  if(!pool.length){
    var next=dated.map(function(q){return q.due;}).sort()[0];
    box.innerHTML='<p class="tiny" style="margin:0"><b>Queue clear.</b> Nothing due today. '+
      'Next batch '+pretty(toDate(next))+'.'+
      (gradedToday?' '+gradedToday+' graded today.':'')+'</p>';
    return;
  }

  /* Held batch, or the next eight that have not been graded today. */
  var frozen=batchFor(t,pool), shown;
  if(frozen){
    shown=frozen.map(function(pr){
      for(var i=0;i<pool.length;i++) if(pool[i].prompt===pr) return pool[i];
      return null;
    }).filter(Boolean);
  } else {
    shown=pool.filter(function(q){ return grades[q.prompt]==null; }).slice(0,8);
    if(!shown.length) shown=pool.slice(0,8);
    saveBatch(t,shown.map(function(q){ return q.prompt; }));
  }

  var ungraded=pool.filter(function(q){
    return grades[q.prompt]==null && shown.indexOf(q)<0;
  }).length;

  var h='<div class="revlist">';
  shown.forEach(function(q,i){
    var late=q.due<t, g=grades[q.prompt], c=cardFor(q.prompt);
    var open=!!REV_OPEN[q.prompt], shownAns=!!REV_ANS[q.prompt];
    var mark=g==null?'&#10003;':(g===1?'&#10007;':(g===3?'~':'&#10003;'));

    h+='<button class="task rev" data-i="'+i+'" data-open="'+(open?1:0)+'"'+
       (g!=null?' data-grade="'+g+'"':'')+' aria-pressed="'+(g!=null)+'">'+
       '<span class="box">'+mark+'</span>'+
       '<span class="pill'+(late?' late':'')+'">'+q.interval+'d</span>'+
       '<span class="txt">'+md(q.prompt)+'</span>'+
       (g!=null?'<span class="next">'+GRADE_LABEL[g]+'<br>&rarr; '+nextIntervalFor(q.interval,g)+'d</span>':'')+
       '<span class="chev">&#9654;</span></button>';

    if(!open) return;
    h+='<div class="revback">';
    if(!c){
      h+='<p class="tiny" style="margin:0">No card written for this one yet. Say your answer out loud '+
         'anyway, then tell Claude Code it has no card and it gets written.</p>';
    } else {
      if(c.from) h+='<div class="lbl">Where this came from</div><div class="from">'+mdBlock(c.from)+'</div>';
      if(c.hint) h+='<div class="lbl">Hint</div><div class="hint">'+mdBlock(c.hint)+'</div>';
      if(c.answer){
        h+= shownAns
          ? '<div class="lbl">Answer</div><div class="ans">'+mdBlock(c.answer)+'</div>'
          : '<button class="revshow" data-i="'+i+'">Show answer</button>'+
            '<p class="tiny" style="margin:8px 0 0">Say it out loud first. Reading the answer before you '+
            'have tried to produce it feels like knowing and is not.</p>';
      }
    }
    h+=gradeStrip(q,g,i);
    /* Same habit as the task rows: type what happened directly under the thing
       it happened on. A blanked card with a note saying why is worth more to the
       next digest than a bare score. */
    var rents=revEntries(q.prompt);
    h+='<div class="notehead">Your working<span class="sp"></span>'+
       (rents.length?rents.length+' logged':'optional')+'</div>'+
       entriesHtml(rents,'rev:'+i,'What did you actually say? Where did it go wrong? Tap Log and it is stamped.');
    h+='</div>';
  });
  h+='</div>';

  var doneN=shown.filter(function(q){ return grades[q.prompt]!=null; }).length;
  var allDone=doneN===shown.length;
  h+='<div class="revdone"><span id="revCount">'+doneN+' of '+shown.length+' graded</span>'+
     '<span class="sp"></span>'+
     (doneN?'<button id="revReset">Reset these</button>':'')+'</div>';

  if(ungraded>0){
    h+='<button class="revnext" id="revNext"'+(allDone?'':' disabled')+'>'+
       (allDone
         ? 'Next '+Math.min(8,ungraded)+' &rarr; &nbsp;('+ungraded+' still overdue)'
         : 'Grade all '+shown.length+' to unlock the next '+Math.min(8,ungraded))+
       '</button>';
  } else if(allDone){
    h+='<button class="revnext" id="revNext" disabled>Overdue queue cleared. '+
       'Everything else is scheduled ahead.</button>';
  }

  var held=M.queue.length-dated.length;
  h+='<p class="tiny" style="margin:10px 0 0">Tap a card to open the hint and the answer. '+
     'Say your answer out loud <b>before</b> you reveal it, then grade it. '+
     '<b>The grade is what moves the item</b> — Got it pushes it out, Missed brings it back. '+
     'It counts the moment you tap it, and it stays in <b>unsynced</b> until you export it. '+
     (ungraded>0?'<b>'+ungraded+' more overdue, held back to keep this block short.</b> ':'')+
     (held>0?held+' item(s) are waiting on a day you have not done yet, so they are not being asked.':'')+'</p>';
  box.innerHTML=h;

  /* The tick box grades it in place; anywhere else on the row opens the card.
     Same split as the sub-task rows on the day card, so there is one gesture. */
  box.querySelectorAll('.task').forEach(function(b){
    b.addEventListener('click',function(ev){
      var q=shown[+b.dataset.i];
      if(ev.target.closest('.box')){
        /* Tapping the box on an ungraded card opens it rather than guessing a
           score for you. Tapping it on a graded one clears the grade. */
        if(reviewGrades()[q.prompt]!=null) setGrade(q.prompt,null);
        else REV_OPEN[q.prompt]=true;
      } else {
        if(REV_OPEN[q.prompt]) delete REV_OPEN[q.prompt]; else REV_OPEN[q.prompt]=true;
      }
      renderDue(); renderSync(); renderStats();
    });
  });
  /* Same Log gesture as the task rows. The key carries the row index because a
     prompt is far too long to put in an attribute. */
  function logRev(key,ta){
    var v=ta.value.trim();
    if(!v) return;
    addRevEntry(shown[+key.split(':')[1]].prompt,v);
    ta.value='';
    renderDue(); renderSync();
  }
  box.querySelectorAll('.note').forEach(function(ta){
    ta.addEventListener('keydown',function(ev){
      if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); logRev(ta.dataset.key,ta); }
    });
  });
  box.querySelectorAll('[data-log]').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.dataset.log;
      logRev(key,box.querySelector('.note[data-key="'+key+'"]'));
    });
  });
  box.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      delRevEntry(shown[+b.dataset.del.split(':')[1]].prompt,+b.dataset.idx);
      renderDue(); renderSync();
    });
  });
  box.querySelectorAll('.revshow').forEach(function(b){
    b.addEventListener('click',function(){
      REV_ANS[shown[+b.dataset.i].prompt]=true;
      renderDue();
    });
  });
  box.querySelectorAll('.grades button').forEach(function(b){
    b.addEventListener('click',function(){
      var q=shown[+b.dataset.i], g=+b.dataset.g;
      setGrade(q.prompt, reviewGrades()[q.prompt]===g ? null : g);
      renderDue(); renderSync(); renderStats();
    });
  });
  if(document.getElementById('revReset'))
    document.getElementById('revReset').addEventListener('click',function(){
      shown.forEach(function(q){ setGrade(q.prompt,null); });
      renderDue(); renderSync(); renderStats();
    });
  if(document.getElementById('revNext'))
    document.getElementById('revNext').addEventListener('click',function(){
      jset(K.batch,{});
      REV_OPEN={}; REV_ANS={};
      renderDue(); renderSync();
      var y=document.getElementById('due').getBoundingClientRect().top+window.pageYOffset-56;
      window.scrollTo(0,Math.max(0,y));
    });
}

/* What grading this way does to the interval, so the consequence is visible
   before the tap rather than discovered a week later. Mirrors lib.js exactly. */
var INTERVALS=[1,3,7,14,30];
function nextIntervalFor(cur,conf){
  var k=INTERVALS.indexOf(cur);
  if(k<0) return cur;
  if(conf>=4) return INTERVALS[Math.min(k+1,INTERVALS.length-1)];
  if(conf===3) return cur;
  return INTERVALS[Math.max(k-1,0)];
}
function gradeStrip(q,g,idx){
  var opts=[[4,'Got it'],[3,'Shaky'],[1,'Missed']];
  var h='<div class="grades">';
  opts.forEach(function(o){
    h+='<button data-g="'+o[0]+'" data-i="'+idx+'" aria-pressed="'+(g===o[0])+'">'+o[1]+
       '<span>&rarr; '+nextIntervalFor(q.interval,o[0])+'d</span></button>';
  });
  h+='</div>';
  h+='<p class="gradehint">'+(g!=null
      ? '<b>'+GRADE_LABEL[g]+'.</b> Due again in '+nextIntervalFor(q.interval,g)+
        ' day'+(nextIntervalFor(q.interval,g)===1?'':'s')+'. Export to make it stick.'
      : 'Grade it on whether you produced the answer <b>out loud</b>, not on whether it looked familiar.')+
     '</p>';
  return h;
}

/* Which cards are open, and which have had their answer revealed. Held in
   memory only, deliberately: an answer that is still on screen tomorrow turns
   the block into reading, and reading is the thing that does not stick. */
var REV_OPEN={}, REV_ANS={};

/* Grades. `{ "2026-08-19": { "<prompt>": 4 } }`, every date kept.

   This replaced a tick that stored only today and threw the rest away, which
   meant a card you recalled perfectly on Tuesday was still overdue on Wednesday
   and nothing you did in this block ever reached a file. A grade is now a real
   record: it shows in the unsynced counter, exports as an `R |` line, and
   reschedules its queue item from the date you actually graded it.

   Pruned to 60 days, which is well past the point where an ungraded export is
   worth syncing, and far enough back that nothing you did this month is lost. */
function allGrades(){ return jget(K.grades,{}); }
function gradesOn(date){ return allGrades()[date] || {}; }
function reviewGrades(){ return gradesOn(iso(todayDate())); }
function setGrade(prompt,conf){
  var all=allGrades(), d=iso(todayDate());
  all[d]=all[d]||{};
  if(conf===null) delete all[d][prompt]; else all[d][prompt]=conf;
  if(!Object.keys(all[d]).length) delete all[d];
  var cutoff=iso(addDays(todayDate(),-60));
  Object.keys(all).forEach(function(k){ if(k<cutoff) delete all[k]; });
  jset(K.grades,all);
}
/* Grades not yet in tracking/review-log.md, oldest first. Same contract as
   pendingLines: the file is what has been synced, localStorage is what is done. */
function pendingReviews(){
  var all=allGrades(), out=[];
  Object.keys(all).sort().forEach(function(d){
    Object.keys(all[d]).forEach(function(prompt){
      if(!M.reviewLog[d+' '+normalise(prompt)]) out.push('R | '+d+' | '+all[d][prompt]+' | '+prompt);
    });
  });
  return out;
}
var GRADE_LABEL = {4:'Got it', 3:'Shaky', 1:'Missed'};

/* ---------- working notes ----------
   Typing under the exact task you are on is the one capture habit that stuck,
   so it is on everything: every task, every sub-step, every review card. There
   is no separate brain-dump file to remember and no decision about where a
   thought goes — the heading is the context.

   Day notes live with the day's ticks (keyed "desk:2" for a task, "desk:2:3" for
   a sub-step). Review notes are keyed by date and prompt, because a card is not
   attached to any one day. */
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* A note is a logged entry, not a text box you leave open. He asked for it that
   way so the time it was written is recorded without anyone having to ask:
   "log them instead of a notepad to type in ... so you know exactly when I did
   them". Several entries per task is the normal case — that is the trail of how
   the thinking actually went. */
function entriesFor(st,key){
  var v=(st.note||{})[key];
  if(v==null) return [];
  if(typeof v==='string') return v?[{time:'',text:v}]:[];   /* pre-timestamp notes */
  return v;
}
function addEntry(day,key,text){
  var st=localFor(day);
  st.note=st.note||{};
  var list=entriesFor(st,key).slice();
  list.push({time:hhmm(new Date()),text:text});
  st.note[key]=list;
  saveLocal(day,stampDone(day,st));
}
function delEntry(day,key,i){
  var st=localFor(day), list=entriesFor(st,key).slice();
  list.splice(i,1);
  st.note=st.note||{};
  if(list.length) st.note[key]=list; else delete st.note[key];
  saveLocal(day,st);
}
function revNotes(date){ return jget(K.revnotes,{})[date] || {}; }
function revEntries(prompt){
  var v=revNotes(iso(todayDate()))[prompt];
  if(v==null) return [];
  if(typeof v==='string') return v?[{time:'',text:v}]:[];
  return v;
}
function addRevEntry(prompt,text){
  var all=jget(K.revnotes,{}), d=iso(todayDate());
  all[d]=all[d]||{};
  var list=revEntries(prompt).slice();
  list.push({time:hhmm(new Date()),text:text});
  all[d][prompt]=list;
  var cutoff=iso(addDays(todayDate(),-60));
  Object.keys(all).forEach(function(k){ if(k<cutoff) delete all[k]; });
  jset(K.revnotes,all);
}
function delRevEntry(prompt,i){
  var all=jget(K.revnotes,{}), d=iso(todayDate());
  if(!all[d]||!all[d][prompt]) return;
  var list=revEntries(prompt).slice();
  list.splice(i,1);
  if(list.length) all[d][prompt]=list; else delete all[d][prompt];
  if(!Object.keys(all[d]||{}).length) delete all[d];
  jset(K.revnotes,all);
}

/* ---------- stopwatch ----------
   One timer runs at a time. Opening a task starts it and stops whatever was
   running, because two tasks cannot both be the thing you are doing, and a
   forgotten timer is the only way this data goes wrong.

   Hard cap at three times the stated budget. A timer left running overnight
   would otherwise report eleven hours on a ten-minute task and quietly wreck
   every average built on it. Past the cap it stops counting and says so. */
var TICK=null;
function allTime(){ return jget(K.time,{}); }
function timeFor(day,key){
  var d=allTime()[day]||{};
  return d[key]||{sec:0,first:'',last:''};
}
function saveTime(day,key,rec){
  var all=allTime();
  all[day]=all[day]||{};
  all[day][key]=rec;
  jset(K.time,all);
}
function running(){ return jget(K.running,null); }
function budgetFor(day,key){
  var e=M.schedule[day-1]; if(!e) return 0;
  var p=key.split(':'), tasks=(M.planByBlock[e.block]||{})[p[0]]||[];
  var t=tasks[+p[1]]; if(!t) return 0;
  var m=/^(\d+)\s*min/.exec(t.text);
  return m?+m[1]:0;
}
function capSeconds(day,key){
  var b=budgetFor(day,key);
  return b?b*60*3:3*60*60;               /* no stated budget: three hours */
}
/* Fold whatever is running into its stored total. Called before anything reads
   or changes a timer, so the number on screen is never stale. */
function settle(){
  var r=running();
  if(!r) return;
  var rec=timeFor(r.day,r.key);
  var add=Math.max(0,Math.floor((Date.now()-r.at)/1000));
  var cap=capSeconds(r.day,r.key);
  var next=Math.min(cap,rec.sec+add);
  rec.sec=next;
  rec.last=hhmm(new Date());
  if(!rec.first) rec.first=hhmm(new Date(r.at));
  rec.capped=next>=cap;
  saveTime(r.day,r.key,rec);
  if(next>=cap) jset(K.running,null);
  else jset(K.running,{day:r.day,key:r.key,at:Date.now()});
}
function startTimer(day,key){
  settle();
  var r=running();
  if(r && r.day===day && r.key===key) return;
  jset(K.running,{day:day,key:key,at:Date.now()});
  var rec=timeFor(day,key);
  if(!rec.first){ rec.first=hhmm(new Date()); saveTime(day,key,rec); }
  startTick();
}
function stopTimer(){ settle(); jset(K.running,null); stopTick(); }
function isRunning(day,key){ var r=running(); return !!(r&&r.day===day&&r.key===key); }
function startTick(){
  if(TICK) return;
  TICK=setInterval(function(){
    var r=running();
    if(!r){ stopTick(); return; }
    settle();
    paintClocks();
  },1000);
}
function stopTick(){ if(TICK){ clearInterval(TICK); TICK=null; } }
function mmss(sec){
  var m=Math.floor(Math.abs(sec)/60), ss=Math.abs(sec)%60;
  return (sec<0?'-':'')+m+':'+String(ss).padStart(2,'0');
}
/* Repaint the digits without re-rendering the day: a full re-render every second
   would close whatever note box he is typing into. */
function paintClocks(){
  document.querySelectorAll('.timer').forEach(function(el){
    var day=+el.dataset.day, key=el.dataset.key;
    var rec=timeFor(day,key), b=budgetFor(day,key);
    var clk=el.querySelector('.clk');
    clk.textContent = b ? mmss(b*60-rec.sec) : mmss(rec.sec);
    el.className='timer'+(isRunning(day,key)?' run':'')+
      (rec.capped?' capped':(b&&rec.sec>b*60?' over':''));
    var btn=el.querySelector('button');
    if(btn) btn.textContent=isRunning(day,key)?'Pause':(rec.sec?'Resume':'Start');
  });
}
function timerHtml(day,key){
  var rec=timeFor(day,key), b=budgetFor(day,key);
  var run=isRunning(day,key);
  var cls='timer'+(run?' run':'')+(rec.capped?' capped':(b&&rec.sec>b*60?' over':''));
  var note;
  if(rec.capped) note='Stopped at 3&times; the budget. Left running by mistake, so the rest is discarded.';
  else if(b&&rec.sec>b*60) note='Over the '+b+' min budget by '+mmss(rec.sec-b*60)+'. Keep going — the estimate is the thing that is wrong.';
  else if(b) note=b+' min budget'+(rec.sec?', '+mmss(rec.sec)+' spent':'')+(rec.first?' &middot; from '+rec.first:'');
  else note='No budget stated. Counting up.';
  return '<div class="'+cls+'" data-day="'+day+'" data-key="'+key+'">'+
    '<span class="clk">'+(b?mmss(b*60-rec.sec):mmss(rec.sec))+'</span>'+
    '<span class="bud">'+note+'</span>'+
    '<button data-timer="'+key+'">'+(run?'Pause':(rec.sec?'Resume':'Start'))+'</button></div>';
}
/* The entry list plus the box that adds to it. Used by tasks, sub-steps and
   review cards alike, so there is one gesture to learn. */
function entriesHtml(list,key,placeholder){
  var h='';
  if(list.length){
    h+='<div class="entries">'+list.map(function(e,i){
      return '<div class="entry"><span class="at">'+(e.time||'&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>'+
        '<span class="tx">'+md(e.text)+'</span>'+
        '<button class="del" data-del="'+key+'" data-idx="'+i+'" aria-label="Delete entry">&times;</button></div>';
    }).join('')+'</div>';
  }
  h+='<div class="noterow"><textarea class="note" data-key="'+key+'" placeholder="'+placeholder+'"></textarea>'+
     '<button class="log" data-log="'+key+'">Log</button></div>';
  return h;
}
/* "D08 desk 2.3" — what the note is filed under in tracking/notes.md. Reads the
   same in the file as it does on screen, so a note can be placed at a glance. */
function noteContext(day,key){
  var p=key.split(':');
  return 'D'+String(day).padStart(2,'0')+' '+p[0]+' '+
         (p.length>2 ? (+p[1]+1)+'.'+(+p[2]+1) : String(+p[1]+1));
}
function revContext(prompt){
  var t=String(prompt).split('|').join('/').replace(/\s+/g,' ').trim();
  return 'review — '+(t.length>90?t.slice(0,88)+'…':t);
}
/* One line per entry, newlines carried as a pilcrow so it survives the clipboard. */
function noteLine(date,time,context,text){
  return 'N | '+date+(time?' '+time:'')+' | '+context+' | '+
         String(text).split(/\r?\n/).join('\u00b6');
}
function pendingNotes(){
  var out=[], all=jget(K.days,{});
  M.schedule.forEach(function(e){
    var st=all[e.day]; if(!st||!st.note) return;
    var when=st.done||iso(e.date);
    Object.keys(st.note).sort().forEach(function(key){
      var ctx=noteContext(e.day,key);
      entriesFor(st,key).forEach(function(en){
        if(!noteFiled(when,ctx,en.time,en.text)) out.push(noteLine(when,en.time,ctx,en.text));
      });
    });
  });
  var rn=jget(K.revnotes,{});
  Object.keys(rn).sort().forEach(function(d){
    Object.keys(rn[d]).forEach(function(prompt){
      var ctx=revContext(prompt), v=rn[d][prompt];
      var list=typeof v==='string'?[{time:'',text:v}]:v;
      list.forEach(function(en){
        if(!noteFiled(d,ctx,en.time,en.text)) out.push(noteLine(d,en.time,ctx,en.text));
      });
    });
  });
  return out;
}
/* Stopwatch readings not yet in tracking/time-log.md. The running timer is
   settled first, so exporting mid-task carries the time up to this second. */
function pendingTimes(){
  settle();
  var out=[], all=allTime(), days=jget(K.days,{});
  Object.keys(all).forEach(function(day){
    var e=M.schedule[+day-1]; if(!e) return;
    var when=(days[day]||{}).done||iso(e.date);
    Object.keys(all[day]).forEach(function(key){
      var rec=all[day][key];
      if(!rec.sec) return;
      var ctx=noteContext(+day,key), b=budgetFor(+day,key);
      var span=(rec.first||'')+(rec.last?'-'+rec.last:'');
      var was=M.timeLog[when+' '+normKey(ctx)];
      if(was && was.seconds===rec.sec && was.span===span) return;
      out.push('T | '+when+' | '+ctx+' | '+rec.sec+' | '+span+' | budget:'+(b||''));
    });
  });
  return out;
}

/* Which cards this block is working through, frozen for the day. Without this
   a graded card would be replaced the instant you tapped it and the list would
   move under your thumb. You clear it deliberately with Next 8. */
function batchFor(date,pool){
  var st=jget(K.batch,{});
  if(st.date===date && st.prompts && st.prompts.length){
    var live=st.prompts.filter(function(pr){
      return pool.some(function(q){ return q.prompt===pr; });
    });
    if(live.length) return live;
  }
  return null;
}
function saveBatch(date,prompts){ jset(K.batch,{date:date,prompts:prompts}); }

/* ---------- render: rings and streak ---------- */
function ring(pct,val,cap,color){
  var r=32, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<div class="ring"><svg width="86" height="86" viewBox="0 0 86 86">'+
    '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="var(--bg3)" stroke-width="8"/>'+
    '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 43 43)"/>'+
    '<text x="43" y="48" text-anchor="middle" fill="var(--fg)" font-size="17" font-weight="700" '+
    'font-family="inherit">'+val+'</text></svg><div class="cap">'+cap+'</div></div>';
}
function activity(){
  var all=jget(K.days,{}), active=[], t=todayDate();
  M.schedule.forEach(function(e){
    var row=M.progress[e.day], on=false;
    if(row && (/^[YP]$/.test(row.desk)||/^[YP]$/.test(row.phone))) on=true;
    var st=all[e.day];
    if(st && (st.conf || Object.keys(st.desk||{}).length || Object.keys(st.phone||{}).length)) on=true;
    if(on) active.push(e.day);
  });
  var n=Math.min(28,Math.max(1,between(M.start,t)+1));
  var week=Math.min(4,Math.ceil(n/7));
  var thisWeek=active.filter(function(d){ return Math.ceil(d/7)===week; }).length;
  return {total:active.length,week:week,thisWeek:thisWeek};
}
function renderStats(){
  var a=activity();
  var t=iso(todayDate());
  var dated=M.queue.filter(function(q){ return /^\d{4}-\d{2}-\d{2}$/.test(q.due); });
  var overdue=dated.filter(function(q){ return q.due<t; }).length;
  var health=dated.length?(1-overdue/dated.length):0;

  document.getElementById('rings').innerHTML =
    ring(a.total/28, a.total+'/28', 'days active<br>this month', 'var(--accent)') +
    ring(health, dated.length?Math.round(health*100)+'%':'--', dated.length?(overdue?overdue+' overdue':'queue clear'):'queue not seeded', 'var(--phone)') +
    ring(M.apps/APP_TARGET, M.apps+'/'+APP_TARGET, 'applications<br>submitted', 'var(--desk)');

  document.getElementById('streak').innerHTML =
    '<div><b>'+a.total+'</b><span>days active, all time</span></div>'+
    '<div><b>'+a.thisWeek+'</b><span>days active, week '+a.week+'</span></div>';
}

/* ---------- render: sync ---------- */
function renderSync(){
  var n=pendingLines().length+pendingReviews().length+pendingNotes().length+
        pendingTimes().length+pendingParks().length;
  var dot=document.getElementById('syncDot'), txt=document.getElementById('syncTxt');
  if(n){ dot.classList.add('pending'); txt.innerHTML='<b>'+n+' unsynced</b>'; }
  else { dot.classList.remove('pending'); txt.textContent='synced'; }
}
function renderPark(){
  var pend=pendingParks().length;
  document.getElementById('parkCount').textContent =
    M.parking.length+' in progress.md'+(pend?', '+pend+' waiting to sync':'')+'.';
}

/* ---------- render: full plan ---------- */
function renderPlan(){
  var h='';
  M.schedule.forEach(function(e){
    var d=M.planByBlock[e.block]; if(!d) return;
    var lists='';
    if(d.open) lists+='<div class="openfile" style="margin-top:8px">'+
                     '<span class="lbl">Open first</span>'+md(d.open)+'</div>';
    if(d.desk.length) lists+='<h4 class="d">Desk</h4><ul>'+d.desk.map(li).join('')+'</ul>';
    if(d.phone.length) lists+='<h4 class="p">Phone</h4><ul>'+d.phone.map(li).join('')+'</ul>';
    if(d.say) lists+='<div class="sayline">Say it out loud: '+md(d.say)+'</div>';
    h+='<details><summary>Day '+String(e.day).padStart(2,'0')+' '+esc(shortTitle(d.title))+
       '<span class="sumday">'+pretty(e.date)+'</span></summary><div class="plan-inner">'+lists+'</div></details>';
  });
  document.getElementById('plan').innerHTML=h;
}
/* Tasks are {text, subs}, not strings — passing the object straight to md()
   rendered "[object Object]" for every line in the full-plan list. Sub-steps
   nest underneath so the collapsed view shows the whole day, not just headings. */
function li(t){
  var txt = (t && typeof t==='object') ? t.text : t;
  var subs = (t && t.subs && t.subs.length)
    ? '<ul>'+t.subs.map(function(s){ return '<li>'+md(s)+'</li>'; }).join('')+'</ul>'
    : '';
  return '<li>'+md(txt)+subs+'</li>';
}
function shortTitle(t){ return t.length>34 ? t.slice(0,33)+'…' : t; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* Escape first, then the two bits of inline markdown the plan actually uses.
   Anything else stays literal, which is the safe direction to fail in. */
function md(s){
  /* Bold before italic, or the ** of a bold run gets eaten as two italics.
     Italics carry the asides in the plan's sub-steps, so they have to render
     rather than showing their own asterisks. */
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*]+)\*/g,'<i>$1</i>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
/* Multi-line markdown, for the back of a review card. Deliberately small:
   fenced code, "- " bullets, blank-line paragraphs, and the same inline rules
   as md(). Anything else stays literal, which is the safe direction to fail in. */
function mdBlock(s){
  var out='', lines=String(s||'').split(/\r?\n/), i=0;
  while(i<lines.length){
    if(/^```/.test(lines[i])){
      var code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out+='<pre class="anscode">'+esc(code.join('\n'))+'</pre>';
      continue;
    }
    if(/^\s*-\s+/.test(lines[i])){
      var items=[];
      while(i<lines.length && /^\s*-\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*-\s+/,''));
      out+='<ul>'+items.map(function(x){ return '<li>'+md(x)+'</li>'; }).join('')+'</ul>';
      continue;
    }
    if(!lines[i].trim()){ i++; continue; }
    var para=[];
    while(i<lines.length && lines[i].trim() && !/^```/.test(lines[i]) && !/^\s*-\s+/.test(lines[i]))
      para.push(lines[i++]);
    out+='<p>'+md(para.join(' '))+'</p>';
  }
  return out;
}

/* ---------- theme ---------- */
function applyTheme(v){
  document.documentElement.setAttribute('data-theme',v);
  /* Keep the status bar tint following the in-app toggle, not the phone's
     system setting, or the two disagree when they are set differently. */
  var metas=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<metas.length;i++) metas[i].setAttribute('media', i===0?'all':'not all');
  if(metas[0]) metas[0].setAttribute('content', v==='dark' ? '#0d1117' : '#f7f8fa');
  document.getElementById('themeBtn').innerHTML = v==='dark' ? '&#9681;' : '&#9680;';
  document.getElementById('themeBtn').setAttribute('aria-label',
    v==='dark'?'Switch to light mode':'Switch to dark mode');
}

/* ---------- boot ---------- */
applyTheme(jget(K.theme,'dark'));
document.getElementById('themeBtn').addEventListener('click',function(){
  var v = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  jset(K.theme,v); applyTheme(v); renderStats();
});

document.getElementById('parkBtn').addEventListener('click',park);
document.getElementById('parkIn').addEventListener('keydown',function(e){ if(e.key==='Enter') park(); });
function park(){
  var i=document.getElementById('parkIn'), v=i.value.trim();
  if(!v) return;
  var list=jget(K.park,[]); list.push(v); jset(K.park,list);
  i.value='';
  copy('- '+v,'Parked and copied');
  renderPark(); renderSync();
}

/* A phone backgrounds the page rather than closing it, and setInterval stops
   being called when it does. Settling on the way out and on the way back is what
   keeps a timer honest across a lock screen. */
document.addEventListener('visibilitychange',function(){
  settle();
  if(document.visibilityState==='visible'){ if(running()) startTick(); paintClocks(); }
  else stopTick();
});
window.addEventListener('pagehide',function(){ settle(); });

loadAll().then(function(f){
  var startM=/^START_DATE:\s*(\S+)/m.exec(f['tracking/config.md']||'');
  M.start = (startM && toDate(startM[1])) || todayDate();
  M.schedule = buildSchedule(M.start);
  M.plan = parsePlan(f['plan/month-01.md']||'');
  M.planByBlock = {}; M.plan.forEach(function(d){ M.planByBlock[d.block]=d; });
  M.progress = parseProgress(f['tracking/progress.md']||'');
  M.parking = parseParking(f['tracking/progress.md']||'');
  M.queue = parseQueue(f['tracking/review-queue.md']||'');
  M.cards = parseCards(f['tracking/review-cards.md']||'');
  M.reviewLog = parseReviewLog(f['tracking/review-log.md']||'');
  M.notes = parseNotesFile(f['tracking/notes.md']||'');
  M.timeLog = parseTimeFile(f['tracking/time-log.md']||'');
  M.apps = countApps(f['tracking/applications.md']||'');

  renderToday(); renderOpen(); renderDue(); renderStats(); renderSync(); renderPark(); renderPlan();
  if(running()) startTick();

  var snap=snapshot();
  var msg={
    live:'Reading the markdown files live.',
    cache:'Offline. Showing the last version this device loaded.',
    snapshot:'Offline. Showing the snapshot baked in'+(snap&&snap.generatedAt?' on '+snap.generatedAt:'')+
             '. Open over http, or via GitHub Pages, to read the files live.',
    none:'Could not read the markdown files and there is no snapshot. Run node scripts/build-snapshot.js.'
  }[SRC];
  document.getElementById('src').textContent=msg;
}).catch(function(e){
  document.getElementById('today').innerHTML='<p class="mute">Failed to load: '+esc(e.message)+'</p>';
});
</script>
</body>
